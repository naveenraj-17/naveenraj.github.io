<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#1e1b4b"/>
  <!-- Terminal icon (lucide-style) centered -->
  <!-- Prompt chevron: > -->
  <polyline points="8,11 13,16 8,21" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore/cursor line -->
  <line x1="15" y1="21" x2="24" y2="21" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
</svg>
